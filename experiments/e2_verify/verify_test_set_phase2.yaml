# E2 test set — direct verifier evaluation harness
#
# 50 candidate continuations on Phase 2, stratified across 4 categories:
#   - actual          (n=15): grounded continuations rooted in entities present in D_t
#   - stale           (n=15): re-assertions of h2 (abandoned at T9) or weakened content
#   - cross_conv      (n=10): claims drawn from Phase 3 (CRDT/OT discussion); ungrounded
#   - counterfactual  (n=10): explicit contradictions of resolved conclusions
#
# `truncation_t` = number of turns of Phase 2 visible (turns 1..t).
# `asserts_id` follows EXPERIMENTS.md: canonical id of the entity c restates,
# or null if c introduces a genuinely new claim with no matching entity in D_t.
# `label` is the grounded/ungrounded ground truth per RUBRIC.md.
#
# Authored by: Sun (2026-04-27). Independent re-annotator: TBD; do not report
# Cohen's κ until a second annotator completes the 20-item overlap (see
# verify_test_set_phase2_blinded.yaml).
#
# The pipeline produces auto-IDs (h_auto_*, o_auto_*) that vary run to run.
# `asserts_id` here uses the *canonical* IDs (h1..h4, o1..o9, mis_monitor)
# from symbolic_engine.py / paper appendix B; the verifier harness must
# resolve canonical → run-specific via the same content-alignment used in
# eval_dep_extraction.py before walking the dep graph.

phase: 2
n_items: 50
