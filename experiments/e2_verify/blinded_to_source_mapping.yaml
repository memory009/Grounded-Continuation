# Mapping from blinded annotator IDs (anno_*) back to source test-set IDs
# (e2_*) for the test-set author's use only. DO NOT share with the
# independent annotator until they have completed all 20 labels.
#
# Source file: verify_test_set_phase2.yaml
# Blinded file: verify_test_set_phase2_blinded.yaml
# Selection: 5 items from each category, interleaved {actual, stale, cross_conv,
#            counterfactual, ...} to reduce order-bias.

